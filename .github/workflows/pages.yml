name: GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Build static site
        env:
          STATIC_EXPORT: "1"
          PAGES_BASE_PATH: /mckey
          SITE_URL: https://sterno874.github.io/mckey
        run: |
          # API routes are Vercel-only (Trendhopper webhook); static export cannot include them.
          mv src/app/api /tmp/mckey-api-stash
          npm run build
          mv /tmp/mckey-api-stash src/app/api
      - uses: actions/upload-pages-artifact@v3
        with:
          path: out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
